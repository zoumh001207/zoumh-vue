<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NCM2MP3 转换器</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="page">
    <header class="hero">
      <div class="hero__badge">Local / No Upload</div>
      <h1>NCM 本地转换器</h1>
      <p class="hero__sub">安卓 / iOS / 鸿蒙可用。文件只在本机处理，速度取决于设备性能。</p>
      <p class="hero__sub">工具最终解释权归邹铭豪所有</p>
      <div class="hero__meta">
        <span>上限 100 文件</span>
      </div>
    </header>

    <section class="panel">
      <div class="panel__title">选择文件 / 文件夹</div>
      <div class="panel__body">
        <div class="stats stats--four">
          <label class="stat stat--action">
            <input id="fileInput" type="file" multiple accept=".ncm" />
            <div class="stat__label">选择 .ncm 文件（多选）</div>
            <div class="stat__value stat__value--cta">点击选择</div>
          </label>
          <label class="stat stat--action">
            <input id="folderInput" type="file" multiple accept=".ncm" webkitdirectory directory />
            <div class="stat__label">选择文件夹</div>
            <div class="stat__value stat__value--cta">点击选择</div>
          </label>
          <div class="stat">
            <div class="stat__label">已选文件</div>
            <div id="fileCount" class="stat__value">0</div>
          </div>
          <div class="stat">
            <div class="stat__label">并发</div>
            <div id="parallelView" class="stat__value">2</div>
          </div>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="panel__title">运行状态</div>
      <div class="panel__body">
        <div class="progress">
          <div class="progress__label">总进度</div>
          <div class="progress__bar"><div id="overallBar" class="progress__fill"></div></div>
          <div id="overallText" class="progress__text">等待开始</div>
        </div>
        <div class="progress">
          <div class="progress__label">当前文件</div>
          <div class="progress__bar"><div id="batchBar" class="progress__fill"></div></div>
          <div id="batchText" class="progress__text">等待开始</div>
        </div>
        <div id="log" class="log"></div>
        <div class="actions">
          <button id="startBtn" class="btn">开始转换</button>
          <button id="stopBtn" class="btn btn--ghost" disabled>停止</button>
        </div>
      </div>
    </section>

    <section class="panel panel--note">
      <div class="panel__title">提示</div>
      <div class="panel__body tips">
        <div>1. 单包输出在内存压力较大的设备上可能会变慢。</div>
        <div>2. 转换失败通常是文件损坏或非 NCM 格式。</div>
        <div>3. 下载会弹出多次保存提示，属于浏览器限制。</div>
      </div>
    </section>
  </main>

  <script>
    const CORE_KEY = new Uint8Array([
      0x68, 0x7A, 0x48, 0x52, 0x41, 0x6D, 0x73, 0x6F,
      0x35, 0x6B, 0x49, 0x6E, 0x62, 0x61, 0x78, 0x57
    ]);

    const state = {
      abort: false
    };

    const els = {
      fileInput: document.getElementById("fileInput"),
      folderInput: document.getElementById("folderInput"),
      fileCount: document.getElementById("fileCount"),
      parallelView: document.getElementById("parallelView"),
      overallBar: document.getElementById("overallBar"),
      batchBar: document.getElementById("batchBar"),
      overallText: document.getElementById("overallText"),
      batchText: document.getElementById("batchText"),
      log: document.getElementById("log"),
      startBtn: document.getElementById("startBtn"),
      stopBtn: document.getElementById("stopBtn")
    };

    function setProgress(bar, textEl, value, text) {
      bar.style.width = Math.max(0, Math.min(100, value)) + "%";
      textEl.textContent = text;
    }

    function logLine(msg) {
      const div = document.createElement("div");
      div.textContent = msg;
      els.log.appendChild(div);
      els.log.scrollTop = els.log.scrollHeight;
    }

    function readIntLE(bytes, offset) {
      return (bytes[offset] & 0xFF) |
        ((bytes[offset + 1] & 0xFF) << 8) |
        ((bytes[offset + 2] & 0xFF) << 16) |
        ((bytes[offset + 3] & 0xFF) << 24);
    }

    const SBOX = new Uint8Array([
      0x63,0x7c,0x77,0x7b,0xf2,0x6b,0x6f,0xc5,0x30,0x01,0x67,0x2b,0xfe,0xd7,0xab,0x76,
      0xca,0x82,0xc9,0x7d,0xfa,0x59,0x47,0xf0,0xad,0xd4,0xa2,0xaf,0x9c,0xa4,0x72,0xc0,
      0xb7,0xfd,0x93,0x26,0x36,0x3f,0xf7,0xcc,0x34,0xa5,0xe5,0xf1,0x71,0xd8,0x31,0x15,
      0x04,0xc7,0x23,0xc3,0x18,0x96,0x05,0x9a,0x07,0x12,0x80,0xe2,0xeb,0x27,0xb2,0x75,
      0x09,0x83,0x2c,0x1a,0x1b,0x6e,0x5a,0xa0,0x52,0x3b,0xd6,0xb3,0x29,0xe3,0x2f,0x84,
      0x53,0xd1,0x00,0xed,0x20,0xfc,0xb1,0x5b,0x6a,0xcb,0xbe,0x39,0x4a,0x4c,0x58,0xcf,
      0xd0,0xef,0xaa,0xfb,0x43,0x4d,0x33,0x85,0x45,0xf9,0x02,0x7f,0x50,0x3c,0x9f,0xa8,
      0x51,0xa3,0x40,0x8f,0x92,0x9d,0x38,0xf5,0xbc,0xb6,0xda,0x21,0x10,0xff,0xf3,0xd2,
      0xcd,0x0c,0x13,0xec,0x5f,0x97,0x44,0x17,0xc4,0xa7,0x7e,0x3d,0x64,0x5d,0x19,0x73,
      0x60,0x81,0x4f,0xdc,0x22,0x2a,0x90,0x88,0x46,0xee,0xb8,0x14,0xde,0x5e,0x0b,0xdb,
      0xe0,0x32,0x3a,0x0a,0x49,0x06,0x24,0x5c,0xc2,0xd3,0xac,0x62,0x91,0x95,0xe4,0x79,
      0xe7,0xc8,0x37,0x6d,0x8d,0xd5,0x4e,0xa9,0x6c,0x56,0xf4,0xea,0x65,0x7a,0xae,0x08,
      0xba,0x78,0x25,0x2e,0x1c,0xa6,0xb4,0xc6,0xe8,0xdd,0x74,0x1f,0x4b,0xbd,0x8b,0x8a,
      0x70,0x3e,0xb5,0x66,0x48,0x03,0xf6,0x0e,0x61,0x35,0x57,0xb9,0x86,0xc1,0x1d,0x9e,
      0xe1,0xf8,0x98,0x11,0x69,0xd9,0x8e,0x94,0x9b,0x1e,0x87,0xe9,0xce,0x55,0x28,0xdf,
      0x8c,0xa1,0x89,0x0d,0xbf,0xe6,0x42,0x68,0x41,0x99,0x2d,0x0f,0xb0,0x54,0xbb,0x16
    ]);
    const INV_SBOX = new Uint8Array(256);
    for (let i = 0; i < 256; i++) INV_SBOX[SBOX[i]] = i;
    const RCON = new Uint8Array([0x00,0x01,0x02,0x04,0x08,0x10,0x20,0x40,0x80,0x1B,0x36]);

    function subWord(w) {
      return (SBOX[(w >>> 24) & 0xFF] << 24) |
             (SBOX[(w >>> 16) & 0xFF] << 16) |
             (SBOX[(w >>> 8) & 0xFF] << 8) |
             (SBOX[w & 0xFF]);
    }
    function rotWord(w) {
      return ((w << 8) | (w >>> 24)) >>> 0;
    }
    function keyExpansion(key) {
      const w = new Uint32Array(44);
      for (let i = 0; i < 4; i++) {
        w[i] = (key[4*i] << 24) | (key[4*i+1] << 16) | (key[4*i+2] << 8) | key[4*i+3];
      }
      for (let i = 4; i < 44; i++) {
        let temp = w[i-1];
        if (i % 4 === 0) temp = subWord(rotWord(temp)) ^ (RCON[i/4] << 24);
        w[i] = (w[i-4] ^ temp) >>> 0;
      }
      return w;
    }
    function xtime(a){ return ((a<<1) ^ ((a&0x80)?0x1b:0)) & 0xff; }
    function mul(a,b){
      let p=0;
      for (let i=0;i<8;i++){
        if (b&1) p^=a;
        a=xtime(a);
        b>>=1;
      }
      return p;
    }
    function addRoundKey(state, w, round){
      for (let c=0;c<4;c++){
        const word = w[round*4+c];
        state[4*c] ^= (word>>>24)&0xff;
        state[4*c+1] ^= (word>>>16)&0xff;
        state[4*c+2] ^= (word>>>8)&0xff;
        state[4*c+3] ^= word&0xff;
      }
    }
    function invSubBytes(s){ for(let i=0;i<16;i++) s[i]=INV_SBOX[s[i]]; }
    function invShiftRows(s){
      const t = s.slice();
      s[1]=t[13]; s[5]=t[1]; s[9]=t[5]; s[13]=t[9];
      s[2]=t[10]; s[6]=t[14]; s[10]=t[2]; s[14]=t[6];
      s[3]=t[7]; s[7]=t[11]; s[11]=t[15]; s[15]=t[3];
    }
    function invMixColumns(s){
      for (let c=0;c<4;c++){
        const i=4*c;
        const a0=s[i],a1=s[i+1],a2=s[i+2],a3=s[i+3];
        s[i]   = (mul(a0,0x0e)^mul(a1,0x0b)^mul(a2,0x0d)^mul(a3,0x09))&0xff;
        s[i+1] = (mul(a0,0x09)^mul(a1,0x0e)^mul(a2,0x0b)^mul(a3,0x0d))&0xff;
        s[i+2] = (mul(a0,0x0d)^mul(a1,0x09)^mul(a2,0x0e)^mul(a3,0x0b))&0xff;
        s[i+3] = (mul(a0,0x0b)^mul(a1,0x0d)^mul(a2,0x09)^mul(a3,0x0e))&0xff;
      }
    }
    function aesEcbDecrypt(data, key){
      if (data.length % 16 !== 0) throw new Error("AES data length invalid");
      const w = keyExpansion(key);
      const out = new Uint8Array(data.length);
      for (let offset=0; offset<data.length; offset+=16){
        const state = data.slice(offset, offset+16);
        addRoundKey(state, w, 10);
        for (let round=9; round>=1; round--){
          invShiftRows(state);
          invSubBytes(state);
          addRoundKey(state, w, round);
          invMixColumns(state);
        }
        invShiftRows(state);
        invSubBytes(state);
        addRoundKey(state, w, 0);
        out.set(state, offset);
      }
      const pad = out[out.length-1];
      if (pad > 0 && pad <= 16) return out.slice(0, out.length - pad);
      return out;
    }

    function decryptAudio(data, offset, key) {
      const keyBox = new Uint8Array(256);
      for (let i=0;i<256;i++) keyBox[i]=i;
      let j=0;
      for (let i=0;i<256;i++){
        j = (j + keyBox[i] + key[i % key.length]) & 0xff;
        const t = keyBox[i]; keyBox[i]=keyBox[j]; keyBox[j]=t;
      }
      const audioLen = data.length - offset;
      const result = new Uint8Array(audioLen);
      for (let i=1;i<=audioLen;i++){
        j = i & 0xff;
        const k = (keyBox[j] + keyBox[(keyBox[j] + j) & 0xff]) & 0xff;
        result[i-1] = data[offset + i - 1] ^ keyBox[k];
      }
      return result;
    }

    function getAudioExtension(bytes) {
      if (bytes.length < 4) return "mp3";
      if ((bytes[0] === 0x49 && bytes[1] === 0x44 && bytes[2] === 0x33) ||
          (bytes[0] === 0xff && (bytes[1] & 0xe0) === 0xe0)) return "mp3";
      if (bytes[0] === 0x66 && bytes[1] === 0x4c && bytes[2] === 0x61 && bytes[3] === 0x43) return "flac";
      if (bytes.length >= 8 && bytes[4] === 0x66 && bytes[5] === 0x74 && bytes[6] === 0x79 && bytes[7] === 0x70) return "m4a";
      return "mp3";
    }

    async function convertNcm(arrayBuffer) {
      const data = new Uint8Array(arrayBuffer);
      const header = [0x43,0x54,0x45,0x4e,0x46,0x44,0x41,0x4d];
      for (let i=0;i<8;i++) if (data[i] !== header[i]) throw new Error("not ncm");
      let pos = 10;
      const keyLen = readIntLE(data, pos); pos += 4;
      const keyData = new Uint8Array(keyLen);
      for (let i=0;i<keyLen;i++) keyData[i] = data[pos+i] ^ 0x64;
      pos += keyLen;
      const decryptedKey = aesEcbDecrypt(keyData, CORE_KEY);
      const rc4Key = decryptedKey.slice(17);
      const metaLen = readIntLE(data, pos); pos += 4;
      if (metaLen > 0 && metaLen < data.length - pos) pos += metaLen;
      pos += 4 + 5;
      const imgLen = readIntLE(data, pos); pos += 4;
      if (imgLen > 0 && imgLen < data.length - pos) pos += imgLen;
      return decryptAudio(data, pos, rc4Key);
    }

    const CRC_TABLE = (() => {
      const t = new Uint32Array(256);
      for (let i=0;i<256;i++){
        let c=i;
        for (let k=0;k<8;k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
        t[i]=c>>>0;
      }
      return t;
    })();
    function crc32(buf) {
      let c = 0xFFFFFFFF;
      for (let i=0;i<buf.length;i++){
        c = CRC_TABLE[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
      }
      return (c ^ 0xFFFFFFFF) >>> 0;
    }
    function le16(n){ return new Uint8Array([n & 0xff, (n>>>8)&0xff]); }
    function le32(n){ return new Uint8Array([n & 0xff, (n>>>8)&0xff, (n>>>16)&0xff, (n>>>24)&0xff]); }

    function buildZip(entries) {
      const chunks = [];
      const central = [];
      let offset = 0;
      for (const e of entries) {
        const nameBytes = new TextEncoder().encode(e.name);
        const crc = crc32(e.data);
        const localHeader = [
          le32(0x04034b50), le16(20), le16(0x0800), le16(0), le16(0), le16(0),
          le32(crc), le32(e.data.length), le32(e.data.length),
          le16(nameBytes.length), le16(0), nameBytes
        ];
        for (const part of localHeader) { chunks.push(part); offset += part.length; }
        chunks.push(e.data); offset += e.data.length;

        const centralHeader = [
          le32(0x02014b50), le16(20), le16(20), le16(0x0800), le16(0), le16(0), le16(0),
          le32(crc), le32(e.data.length), le32(e.data.length),
          le16(nameBytes.length), le16(0), le16(0),
          le16(0), le16(0), le32(0), le32(offset - e.data.length - 30 - nameBytes.length), nameBytes
        ];
        for (const part of centralHeader) central.push(part);
      }
      let centralSize = 0;
      for (const part of central) centralSize += part.length;
      const centralOffset = offset;
      chunks.push(...central);
      const end = [
        le32(0x06054b50), le16(0), le16(0), le16(entries.length), le16(entries.length),
        le32(centralSize), le32(centralOffset), le16(0)
      ];
      chunks.push(...end);
      return new Blob(chunks, { type: "application/zip" });
    }

    async function runParallel(files, worker, parallelism, onProgress) {
      const results = [];
      let idx = 0;
      async function loop() {
        while (true) {
          if (state.abort) throw new Error("aborted");
          const i = idx++;
          if (i >= files.length) return;
          try {
            results[i] = await worker(files[i], i);
          } catch (e) {
            results[i] = { error: e };
          }
          if (onProgress) onProgress(i + 1, files.length);
        }
      }
      const tasks = [];
      for (let i=0;i<Math.min(parallelism, files.length);i++) tasks.push(loop());
      await Promise.all(tasks);
      return results;
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function updateCounts(files) {
      const ncmFiles = files.filter(f => f.name.toLowerCase().endsWith(".ncm"));
      els.fileCount.textContent = ncmFiles.length.toString();
      els.parallelView.textContent = "2";
    }

    els.fileInput.addEventListener("change", () => updateCounts([
      ...Array.from(els.fileInput.files || []),
      ...Array.from(els.folderInput.files || [])
    ]));
    els.folderInput.addEventListener("change", () => updateCounts([
      ...Array.from(els.fileInput.files || []),
      ...Array.from(els.folderInput.files || [])
    ]));

    els.stopBtn.addEventListener("click", () => {
      state.abort = true;
      els.stopBtn.disabled = true;
      logLine("已请求停止，等待当前任务结束。");
    });

    els.startBtn.addEventListener("click", async () => {
      const allFiles = [
        ...Array.from(els.fileInput.files || []),
        ...Array.from(els.folderInput.files || [])
      ];
      const files = allFiles.filter(f => f.name.toLowerCase().endsWith(".ncm"));
      if (!files.length) { setProgress(els.overallBar, els.overallText, 0, "请选择 .ncm 文件"); return; }
      if (files.length > 100) { setProgress(els.overallBar, els.overallText, 0, "一次最多 100 个文件"); return; }

      state.abort = false;
      els.log.textContent = "";
      els.startBtn.disabled = true;
      els.stopBtn.disabled = false;

      const parallelism = 2;
      const prefix = "output";

      let processed = 0;
      let successTotal = 0;
      let failTotal = 0;

      try {
        const ncmList = files.map(f => ({ name: f.name, file: f }));
        logLine(`开始转换，文件数 ${ncmList.length}`);
        setProgress(els.batchBar, els.batchText, 0, "处理中...");

        const results = await runParallel(ncmList, async (item) => {
          const buf = item.file ? await item.file.arrayBuffer() : item.data.buffer;
          const audio = await convertNcm(buf);
          const ext = getAudioExtension(audio);
          const base = item.name.split("/").pop();
          const name = base.replace(/\.ncm$/i, "") + "." + ext;
          return { name: "outPut/" + name, data: audio };
        }, parallelism, (done, total) => {
          processed = done;
          const percent = Math.floor((done / total) * 100);
          setProgress(els.batchBar, els.batchText, percent, `当前: ${done}/${total}`);
          setProgress(els.overallBar, els.overallText, percent, `总进度: ${done}/${total}`);
        });

        const entries = [];
        for (const r of results) {
          if (r && !r.error) {
            entries.push(r);
            successTotal++;
          } else {
            failTotal++;
          }
        }
        if (entries.length) {
          const zipBlob = buildZip(entries);
          downloadBlob(zipBlob, `${prefix}.zip`);
        }
        setProgress(els.batchBar, els.batchText, 100, "处理完成");
        setProgress(els.overallBar, els.overallText, 100, `完成: 成功 ${successTotal}, 失败 ${failTotal}`);
        logLine(`完成: 成功 ${successTotal}, 失败 ${failTotal}`);
      } catch (e) {
        if (e.message === "aborted") {
          setProgress(els.overallBar, els.overallText, 0, "已停止");
          logLine("已停止");
        } else {
          setProgress(els.overallBar, els.overallText, 0, "发生错误");
          logLine("错误: " + e.message);
        }
      } finally {
        els.startBtn.disabled = false;
        els.stopBtn.disabled = true;
      }
    });
  </script>
</body>
</html>
